<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Välkommen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #1a1a1a;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      margin: 0 0 30px 0;
      text-align: center;
    }

    img {
      display: block;
      width: 100%;
      max-width: 800px;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>Välkommen</h1>

  <img src="assets/images/books.jpg" alt="Böcker">

</body>
</html>

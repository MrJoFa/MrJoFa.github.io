
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talutmaning till Leo</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #e8f3e9;
  padding: 40px 15px;
}
.container {
  background: white;
  padding: 30px 20px;
  border-radius: 15px;
  max-width: 350px;
  margin: auto;
  box-shadow: 0 3px 12px #ccd3df;
}
h1 {
  color: #b51f32;
}
input {
  width: 150px;
  height: 65px;
  font-size: 32px;
  text-align: center;
  border: 2px solid #536783;
  border-radius: 10px;
  margin: 20px;
}
button {
  padding: 12px 25px;
  background: #b51f32;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}
#result {
  font-size: 21px;
  font-weight: bold;
  margin-top: 25px;
}
</style>
</head>
<body>

<div class="container">
  <h1>🎄 Talutmaning 🎄</h1>
  <p>Vilket är det rätta talet?</p>

  <input
    id="answer"
    type="number"
    placeholder="Skriv här"
  >

  <br>

  <button onclick="checkAnswer()">
    Kontrollera
  </button>

  <div id="result"></div>
</div>

<script>
function checkAnswer() {
  const answer = document.getElementById("answer").value;
  const result = document.getElementById("result");

  if (answer.trim() === "25") {
    result.textContent =
      "🎉 Bra räknat Leo! Dagens bokstav är T.";
    result.style.color = "#16834a";
  } else {
    result.textContent = "❌ Fel svar! Försök igen.";
    result.style.color = "#d13b3b";
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Julens Skjutpussel</title>
  <style>
    :root {
      --size: min(88vw, 480px);
      --grid: 4;
      --gap: 4px;
      --img: url("fortnitejul.jpg");
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #141b2d;
      color: #fff;
      padding: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }

    .hud {
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 1rem;
    }

    button {
      background: #ff4757;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s ease;
    }

    button:hover {
      background: #ff6b81;
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.97);
    }

    /* Själva spelplanen */
    .board {
      position: relative;
      width: var(--size);
      height: var(--size);
      background: rgba(255, 255, 255, 0.08);
      border: 4px solid #2f3b58;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    /* Varje skjutbricka */
    .tile {
      position: absolute;
      width: calc((100% - (var(--grid) - 1) * var(--gap)) / var(--grid));
      height: calc((100% - (var(--grid) - 1) * var(--gap)) / var(--grid));
      background-image: var(--img);
      background-size: calc(var(--grid) * 100%) calc(var(--grid) * 100%);
      border-radius: 6px;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25), 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease;
    }

    .tile:hover {
      box-shadow: inset 0 0 0 2px #ffd32a, 0 6px 14px rgba(0, 0, 0, 0.45);
      z-index: 2;
    }

    .win-banner {
      min-height: 24px;
      font-weight: 700;
      color: #ffd32a;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Julens Skjutpussel</h1>

  <div class="hud">
    <div>Drag: <strong id="moves">0</strong></div>
    <button id="shuffleBtn" type="button">Blanda om</button>
  </div>

  <div class="board" id="board" aria-label="Skjutpussel"></div>
  <div class="win-banner" id="status"></div>

  <script>
    const GRID = 4;
    const GAP_PX = 4;
    const TOTAL = GRID * GRID;
    const EMPTY = TOTAL - 1; // Sista rutan (index 15) är tom från start

    const boardEl = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const statusEl = document.getElementById("status");
    const shuffleBtn = document.getElementById("shuffleBtn");

    // tiles[positionIndex] = pieceId (0..14, eller 15 för tom plats)
    let tiles = [];
    let moves = 0;
    const tileElements = [];

    function createTileElements() {
      boardEl.innerHTML = "";
      for (let id = 0; id < EMPTY; id++) {
        const el = document.createElement("div");
        el.className = "tile";
        el.dataset.id = id;

        const origRow = Math.floor(id / GRID);
        const origCol = id % GRID;
        const posX = (origCol / (GRID - 1)) * 100;
        const posY = (origRow / (GRID - 1)) * 100;
        el.style.backgroundPosition = `${posX}% ${posY}%`;

        el.addEventListener("click", () => handleTileClick(id));
        boardEl.appendChild(el);
        tileElements[id] = el;
      }
    }

    function renderPositions() {
      const boardSize = boardEl.clientWidth;
      const cellSize = (boardSize - GAP_PX * (GRID - 1)) / GRID;

      for (let pos = 0; pos < TOTAL; pos++) {
        const pieceId = tiles[pos];
        if (pieceId === EMPTY) continue;

        const row = Math.floor(pos / GRID);
        const col = pos % GRID;
        const x = col * (cellSize + GAP_PX);
        const y = row * (cellSize + GAP_PX);

        tileElements[pieceId].style.transform = `translate(${x}px, ${y}px)`;
      }
    }

    function getNeighbors(pos) {
      const row = Math.floor(pos / GRID);
      const col = pos % GRID;
      const neighbors = [];
      if (row > 0) neighbors.push((row - 1) * GRID + col);
      if (row < GRID - 1) neighbors.push((row + 1) * GRID + col);
      if (col > 0) neighbors.push(row * GRID + (col - 1));
      if (col < GRID - 1) neighbors.push(row * GRID + (col + 1));
      return neighbors;
    }

    function handleTileClick(pieceId) {
      const currentPos = tiles.indexOf(pieceId);
      const emptyPos = tiles.indexOf(EMPTY);

      if (!getNeighbors(currentPos).includes(emptyPos)) return;

      [tiles[currentPos], tiles[emptyPos]] = [tiles[emptyPos], tiles[currentPos]];
      moves++;
      movesEl.textContent = moves;
      renderPositions();
      checkWin();
    }

    function shuffleBoard(steps = 140) {
      tiles = Array.from({ length: TOTAL }, (_, i) => i);
      let emptyPos = EMPTY;
      let prevEmpty = -1;

      // Garanterat lösbart genom att göra giltiga drag från löst läge
      for (let i = 0; i < steps; i++) {
        const candidates = getNeighbors(emptyPos).filter((n) => n !== prevEmpty);
        const nextPos = candidates[Math.floor(Math.random() * candidates.length)];
        [tiles[emptyPos], tiles[nextPos]] = [tiles[nextPos], tiles[emptyPos]];
        prevEmpty = emptyPos;
        emptyPos = nextPos;
      }

      moves = 0;
      movesEl.textContent = moves;
      statusEl.textContent = "";
      renderPositions();
    }

    function checkWin() {
      const solved = tiles.every((val, idx) => val === idx);
      if (solved) {
        statusEl.textContent = `Snyggt jobbat! Du löste pusslet på ${moves} drag.`;
      }
    }

    shuffleBtn.addEventListener("click", () => shuffleBoard());
    window.addEventListener("resize", renderPositions);

    createTileElements();
    shuffleBoard();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Julens Skjutpussel</title>
  <style>
    :root {
      --width: min(92vw, 680px);
      --grid: 4;
      --gap: 4px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #141b2d;
      color: #fff;
      padding: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    button, .file-label {
      background: #ff4757;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s ease;
    }

    .file-label {
      background: #1e90ff;
    }

    button:hover {
      background: #ff6b81;
      transform: translateY(-1px);
    }

    .file-label:hover {
      background: #379bff;
      transform: translateY(-1px);
    }

    input[type="file"] {
      display: none;
    }

    /* Spelplanen i 16:9-format så hela bilden får plats */
    .board {
      position: relative;
      width: var(--width);
      aspect-ratio: 16 / 9;
      background: rgba(255, 255, 255, 0.08);
      border: 4px solid #2f3b58;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    /* Varje skjutbricka */
    .tile {
      position: absolute;
      width: calc((100% - (var(--grid) - 1) * var(--gap)) / var(--grid));
      height: calc((100% - (var(--grid) - 1) * var(--gap)) / var(--grid));
      background-size: calc(var(--grid) * 100%) calc(var(--grid) * 100%);
      background-repeat: no-repeat;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28), 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease;
    }

    .tile:hover {
      box-shadow: inset 0 0 0 2px #ffd32a, 0 6px 14px rgba(0, 0, 0, 0.45);
      z-index: 2;
    }

    .win-banner {
      min-height: 32px;
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffd32a;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <h1>Julens Skjutpussel</h1>

  <div class="controls">
    <label class="file-label" for="imgUpload">Välj din Fortnite-bild</label>
    <input type="file" id="imgUpload" accept="image/*" />
    <button id="shuffleBtn" type="button">Blanda om</button>
    <span>Drag: <strong id="moves">0</strong></span>
  </div>

  <div class="board" id="board" aria-label="Skjutpussel"></div>
  <div class="win-banner" id="status"></div>

  <script>
    const GRID = 4;
    const GAP_PX = 4;
    const TOTAL = GRID * GRID;
    const EMPTY = TOTAL - 1;

    const boardEl = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const statusEl = document.getElementById("status");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const imgUpload = document.getElementById("imgUpload");

    let tiles = [];
    let moves = 0;
    const tileElements = [];

    // Inbyggd reservbild i julstil ifall fortnitejul.jpg inte hittas direkt
    const fallbackSvg = `data:image/svg+xml;utf8,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#2e7d32"/>
            <stop offset="25%" stop-color="#6a1b9a"/>
            <stop offset="50%" stop-color="#0288d1"/>
            <stop offset="75%" stop-color="#ef6c00"/>
            <stop offset="100%" stop-color="#1565c0"/>
          </linearGradient>
        </defs>
        <rect width="1280" height="720" fill="url(#bg)"/>
        <text x="50%" y="46%" font-family="Arial Black, sans-serif" font-size="115" fill="#ffeb3b" stroke="#000" stroke-width="10" text-anchor="middle">JULEN</text>
        <text x="50%" y="65%" font-family="Arial Black, sans-serif" font-size="115" fill="#29b6f6" stroke="#000" stroke-width="10" text-anchor="middle">BESTÄMMER</text>
        <text x="50%" y="84%" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle">Klicka på "Välj din Fortnite-bild" ovan för att ladda in ditt foto</text>
      </svg>
    `)}`;

    function setBoardImage(url) {
      tileElements.forEach((el) => {
        el.style.backgroundImage = `url("${url}")`;
      });
    }

    function createTileElements() {
      boardEl.innerHTML = "";
      for (let id = 0; id < EMPTY; id++) {
        const el = document.createElement("div");
        el.className = "tile";

        const origRow = Math.floor(id / GRID);
        const origCol = id % GRID;
        const posX = (origCol / (GRID - 1)) * 100;
        const posY = (origRow / (GRID - 1)) * 100;
        el.style.backgroundPosition = `${posX}% ${posY}%`;

        el.addEventListener("click", () => handleTileClick(id));
        boardEl.appendChild(el);
        tileElements[id] = el;
      }

      // Försök ladda fortnitejul.jpg automatiskt, annars visa reservbilden
      const testImg = new Image();
      testImg.onload = () => setBoardImage("fortnitejul.jpg");
      testImg.onerror = () => setBoardImage(fallbackSvg);
      testImg.src = "fortnitejul.jpg";
    }

    function renderPositions() {
      const boardW = boardEl.clientWidth;
      const boardH = boardEl.clientHeight;
      const cellW = (boardW - GAP_PX * (GRID - 1)) / GRID;
      const cellH = (boardH - GAP_PX * (GRID - 1)) / GRID;

      for (let pos = 0; pos < TOTAL; pos++) {
        const pieceId = tiles[pos];
        if (pieceId === EMPTY) continue;

        const row = Math.floor(pos / GRID);
        const col = pos % GRID;
        const x = col * (cellW + GAP_PX);
        const y = row * (cellH + GAP_PX);

        tileElements[pieceId].style.transform = `translate(${x}px, ${y}px)`;
      }
    }

    function getNeighbors(pos) {
      const row = Math.floor(pos / GRID);
      const col = pos % GRID;
      const neighbors = [];
      if (row > 0) neighbors.push((row - 1) * GRID + col);
      if (row < GRID - 1) neighbors.push((row + 1) * GRID + col);
      if (col > 0) neighbors.push(row * GRID + (col - 1));
      if (col < GRID - 1) neighbors.push(row * GRID + (col + 1));
      return neighbors;
    }

    function handleTileClick(pieceId) {
      const currentPos = tiles.indexOf(pieceId);
      const emptyPos = tiles.indexOf(EMPTY);

      if (!getNeighbors(currentPos).includes(emptyPos)) return;

      [tiles[currentPos], tiles[emptyPos]] = [tiles[emptyPos], tiles[currentPos]];
      moves++;
      movesEl.textContent = moves;
      renderPositions();
      checkWin();
    }

    function shuffleBoard(steps = 120) {
      tiles = Array.from({ length: TOTAL }, (_, i) => i);
      let emptyPos = EMPTY;
      let prevEmpty = -1;

      for (let i = 0; i < steps; i++) {
        const candidates = getNeighbors(emptyPos).filter((n) => n !== prevEmpty);
        const nextPos = candidates[Math.floor(Math.random() * candidates.length)];
        [tiles[emptyPos], tiles[nextPos]] = [tiles[nextPos], tiles[emptyPos]];
        prevEmpty = emptyPos;
        emptyPos = nextPos;
      }

      moves = 0;
      movesEl.textContent = moves;
      statusEl.textContent = "";
      renderPositions();
    }

    function checkWin() {
      const solved = tiles.every((val, idx) => val === idx);
      if (solved) {
        statusEl.textContent = "Snyggt jobbat dagens bokstav är G";
      }
    }

    imgUpload.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const objectUrl = URL.createObjectURL(file);
      setBoardImage(objectUrl);
      shuffleBoard();
    });

    shuffleBtn.addEventListener("click", () => shuffleBoard());
    window.addEventListener("resize", renderPositions);

    createTileElements();
    shuffleBoard();
  </script>
</body>
</html>

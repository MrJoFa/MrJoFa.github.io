
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Julmemory</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #173b2b, #315c3d);
  text-align: center;
  padding: 20px;
  color: white;
}

h1 {
  color: #ffe6a3;
  font-size: 34px;
}

.info {
  display: flex;
  justify-content: center;
  gap: 35px;
  font-size: 20px;
  margin: 20px;
  flex-wrap: wrap;
}

#timer {
  color: #ffcf69;
  font-weight: bold;
}

.game {
  display: grid;
  grid-template-columns: repeat(4, 90px);
  gap: 12px;
  justify-content: center;
  margin: 25px auto;
}

.card {
  width: 90px;
  height: 100px;
  background: #6b3528;
  border: 3px solid #d6ad64;
  border-radius: 12px;
  font-size: 38px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  box-shadow: 0 4px 7px #111;
  user-select: none;
}

.card.hidden {
  background: #6b3528;
}

.card.hidden::after {
  content: "🎄";
}

.card.matched {
  background: #f7e9c5;
  cursor: default;
}

button {
  background: #b52e32;
  color: white;
  border: 2px solid #ffe6a3;
  padding: 12px 25px;
  font-size: 18px;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 15px;
}

#message {
  font-size: 25px;
  font-weight: bold;
  color: #ffe6a3;
  margin-top: 25px;
}

@media (max-width: 430px) {
  .game {
    grid-template-columns: repeat(4, 70px);
    gap: 8px;
  }

  .card {
    width: 70px;
    height: 80px;
    font-size: 32px;
  }
}
</style>
</head>

<body>

<h1>🎄 Julmemory 🎄</h1>
<p>Hitta alla 8 julpar innan tiden tar slut!</p>

<div class="info">
  <div>⏱ Tid: <span id="timer">60</span> sek</div>
  <div>⭐ Par: <span id="pairs">0</span> / 8</div>
</div>

<div class="game" id="game"></div>

<div id="message"></div>

<button onclick="startGame()">Börja om</button>

<script>
const symbols = ["🎅", "🎄", "⛄", "🎁", "⭐", "🔔", "🦌", "❄️"];

let cards = [];
let firstCard = null;
let secondCard = null;
let locked = false;
let matchedPairs = 0;
let attempts = 0;
let timeLeft = 60;
let timerInterval;
let gameOver = false;

function startGame() {
  clearInterval(timerInterval);

  cards = [...symbols, ...symbols].sort(() => Math.random() - 0.5);
  firstCard = null;
  secondCard = null;
  locked = false;
  matchedPairs = 0;
  attempts = 0;
  timeLeft = 60;
  gameOver = false;

  document.getElementById("pairs").textContent = "0";
  document.getElementById("timer").textContent = "60";
  document.getElementById("message").textContent = "";

  const game = document.getElementById("game");
  game.innerHTML = "";

  cards.forEach((symbol, index) => {
    const card = document.createElement("div");
    card.className = "card hidden";
    card.dataset.symbol = symbol;
    card.dataset.index = index;
    card.addEventListener("click", () => flipCard(card));
    game.appendChild(card);
  });

  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById("timer").textContent = timeLeft;

    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);
}

function flipCard(card) {
  if (
    gameOver ||
    locked ||
    card.classList.contains("matched") ||
    card === firstCard ||
    !card.classList.contains("hidden")
  ) {
    return;
  }

  card.classList.remove("hidden");
  card.textContent = card.dataset.symbol;

  if (!firstCard) {
    firstCard = card;
    return;
  }

  secondCard = card;
  locked = true;
  attempts++;

  if (firstCard.dataset.symbol === secondCard.dataset.symbol) {
    firstCard.classList.add("matched");
    secondCard.classList.add("matched");

    matchedPairs++;
    document.getElementById("pairs").textContent = matchedPairs;

    firstCard = null;
    secondCard = null;
    locked = false;

    if (matchedPairs === 8) {
      winGame();
    }
  } else {
    setTimeout(() => {
      firstCard.classList.add("hidden");
      secondCard.classList.add("hidden");
      firstCard.textContent = "";
      secondCard.textContent = "";

      firstCard = null;
      secondCard = null;
      locked = false;
    }, 900);
  }
}

function winGame() {
  gameOver = true;
  clearInterval(timerInterval);
  document.getElementById("message").innerHTML =
    "🎉 BRA SPELAT LEO! 🎉<br>" +
    "Du hittade alla julens par!<br>" +
    "Dagens bokstav är <span style='color:#ffcf69;font-size:42px'>N</span>";
}

function endGame() {
  gameOver = true;
  locked = true;
  clearInterval(timerInterval);
  document.getElementById("message").textContent =
    "⏰ Tiden är slut! Försök igen!";
}

startGame();
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Tre bildrebusar</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eaf2ff;
  text-align: center;
  padding: 30px;
}

h1 {
  color: #23395d;
}

.container {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
}

.rebus {
  background: white;
  border-radius: 18px;
  padding: 25px;
  width: 220px;
  box-shadow: 0 4px 12px #0002;
}

.bilder {
  font-size: 45px;
  margin: 20px 0;
}

.tecken {
  font-size: 28px;
  font-weight: bold;
  color: #e07827;
}

.fraga {
  font-size: 17px;
  color: #333;
}

input {
  width: 50px;
  padding: 10px;
  font-size: 22px;
  text-align: center;
  margin-top: 15px;
}
</style>
</head>

<body>

<h1>🕵️ Lös bildrebusarna!</h1>
<p>Varje rebus bildar ett tal. Vilka tre siffror söker du?</p>

<div class="container">

  <div class="rebus">
    <h2>Rebus 1</h2>
    <div class="bilder">🐱 + 🐱</div>
    <div class="tecken">KATT + KATT</div>
    <p class="fraga">Hur många ben har två katter tillsammans?</p>
    <input type="number" min="0" max="9">
  </div>

  <div class="rebus">
    <h2>Rebus 2</h2>
    <div class="bilder">🚲 + 🚲</div>
    <div class="tecken">HJUL + HJUL</div>
    <p class="fraga">Hur många hjul har två cyklar tillsammans?</p>
    <input type="number" min="0" max="9">
  </div>

  <div class="rebus">
    <h2>Rebus 3</h2>
    <div class="bilder">🖐️ + 🖐️</div>
    <div class="tecken">HAND + HAND</div>
    <p class="fraga">Hur många fingrar har två händer tillsammans?</p>
    <input type="number" min="0" max="9">
  </div>

</div>

</body>
</html>

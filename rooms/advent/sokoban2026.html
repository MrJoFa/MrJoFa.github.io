
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomtens svåra juluppdrag</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #e7f2e8;
  color: #234a32;
  padding: 12px;
}
h1 { color: #b51f32; }
#game {
  display: grid;
  grid-template-columns: repeat(11, min(7.7vw, 42px));
  gap: 2px;
  justify-content: center;
  margin: 20px auto;
}
.cell {
  width: min(7.7vw, 42px);
  height: min(7.7vw, 42px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f8f2;
  border-radius: 5px;
  font-size: min(6vw, 25px);
}
.wall { background: #285d3c; }
button {
  background: #b51f32;
  color: white;
  border: none;
  border-radius: 9px;
  padding: 13px;
  font-size: 23px;
  cursor: pointer;
}
.controls {
  display: grid;
  grid-template-columns: repeat(3, 62px);
  gap: 6px;
  justify-content: center;
  margin: 18px;
}
.reset {
  font-size: 16px;
  background: #315d43;
}
#message {
  font-size: 22px;
  font-weight: bold;
  color: #16834a;
  margin: 20px auto;
}
</style>
</head>
<body>

<h1>🎅 Tomtens svåra juluppdrag 🎄</h1>
<p>Tomten har tappat bort sina fem julklappar!</p>
<p>Flytta alla 🎁 till de fem 🧦.</p>
<p>Akta dig för väggarna och tänk flera steg framåt!</p>

<div id="game"></div>

<div class="controls">
  <span></span>
  <button onclick="move(0,-1)">⬆️</button>
  <span></span>
  <button onclick="move(-1,0)">⬅️</button>
  <button onclick="move(0,1)">⬇️</button>
  <button onclick="move(1,0)">➡️</button>
</div>

<button class="reset" onclick="resetGame()">🔄 Börja om</button>

<div id="message"></div>

<script>
const layout = [
"###########",
"#.........#",
"#.B.B.B.B.#",
"#.........#",
"#..#...#..#",
"#..#...#..#",
"#.........#",
"#.G.G.G.G.#",
"#.........#",
"#..G.G....#",
"###########"
];

// Fem mål och fem julklappar
const goals = [
 [1,7],[3,7],[5,7],[7,7],[4,9]
];

let walls = [];
let boxes = [];
let player;
let finished = false;

function resetGame() {
  walls = [];
  boxes = [];
  player = {x:5,y:1};
  finished = false;

  for(let y=0;y<layout.length;y++) {
    for(let x=0;x<layout[y].length;x++) {
      if(layout[y][x] === "#")
        walls.push({x,y});

      if(layout[y][x] === "B")
        boxes.push({x,y});
    }
  }

  document.getElementById("message").textContent = "";
  draw();
}

function wallAt(x,y) {
  return walls.some(w => w.x===x && w.y===y);
}

function boxAt(x,y) {
  return boxes.findIndex(b => b.x===x && b.y===y);
}

function goalAt(x,y) {
  return goals.some(g => g[0]===x && g[1]===y);
}

function move(dx,dy) {
  if(finished) return;

  const nx = player.x+dx;
  const ny = player.y+dy;

  if(wallAt(nx,ny)) return;

  const index = boxAt(nx,ny);

  if(index !== -1) {
    const bx = nx+dx;
    const by = ny+dy;

    if(wallAt(bx,by) || boxAt(bx,by)!==-1)
      return;

    boxes[index] = {x:bx,y:by};
  }

  player = {x:nx,y:ny};

  draw();
  checkWin();
}

function draw() {
  const game = document.getElementById("game");
  game.innerHTML = "";

  for(let y=0;y<layout.length;y++) {
    for(let x=0;x<layout[y].length;x++) {
      const cell = document.createElement("div");
      cell.className = "cell";

      if(wallAt(x,y)) {
        cell.classList.add("wall");
        cell.textContent = "🌲";
      } else if(boxAt(x,y)!==-1) {
        cell.textContent = "🎁";
      } else if(player.x===x && player.y===y) {
        cell.textContent = "🎅";
      } else if(goalAt(x,y)) {
        cell.textContent = "🧦";
      } else {
        cell.textContent = "❄️";
      }

      game.appendChild(cell);
    }
  }
}

function checkWin() {
  const completed = boxes.filter(b =>
    goalAt(b.x,b.y)
  ).length;

  if(completed === 5 && boxes.length === 5) {
    finished = true;
    document.getElementById("message").textContent =
      "🎉 Bra jobbat Leo! Bokstaven är I.";
  }
}

document.addEventListener("keydown", function(e) {
  const keys = {
    ArrowUp:[0,-1],
    ArrowDown:[0,1],
    ArrowLeft:[-1,0],
    ArrowRight:[1,0]
  };

  if(keys[e.key]) {
    e.preventDefault();
    move(...keys[e.key]);
  }
});

resetGame();
</script>

</body>
</html>

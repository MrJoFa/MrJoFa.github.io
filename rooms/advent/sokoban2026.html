
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomtens juluppdrag</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #e4f1e8;
  padding: 15px;
  color: #244b35;
}
h1 { color: #b51f32; }
p { font-size: 16px; }
#game {
  display: grid;
  grid-template-columns: repeat(11, min(7.5vw, 43px));
  gap: 2px;
  justify-content: center;
  margin: 20px auto;
}
.cell {
  width: min(7.5vw, 43px);
  height: min(7.5vw, 43px);
  background: #f5f8f2;
  border-radius: 5px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: min(6vw, 27px);
  box-sizing: border-box;
}
.wall {
  background: #276344;
}
.controls {
  display: grid;
  grid-template-columns: repeat(3, 65px);
  gap: 7px;
  justify-content: center;
  margin: 20px;
}
button {
  background: #b51f32;
  color: white;
  border: none;
  border-radius: 9px;
  padding: 13px;
  font-size: 23px;
  cursor: pointer;
}
.reset {
  font-size: 16px;
  background: #315d43;
}
#message {
  font-size: 22px;
  font-weight: bold;
  color: #16834a;
  margin: 20px auto;
  max-width: 400px;
}
</style>
</head>
<body>

<h1>🎅 Tomtens juluppdrag 🎄</h1>

<p>Tomten har tappat bort sina julklappar!</p>
<p>Hjälp honom att skjuta alla 5 julklappar
till julstrumporna 🧦.</p>
<p>Var försiktig! Du kan inte dra tillbaka en julklapp.</p>

<div id="game"></div>

<div class="controls">
  <span></span>
  <button onclick="move(0,-1)">⬆️</button>
  <span></span>
  <button onclick="move(-1,0)">⬅️</button>
  <button onclick="move(0,1)">⬇️</button>
  <button onclick="move(1,0)">➡️</button>
</div>

<button class="reset" onclick="resetGame()">
  🔄 Börja om
</button>

<div id="message"></div>

<script>
const level = [
"###########",
"#.........#",
"#B.B.B.B.B#",
"#.........#",
"#.#.#.#.#.#",
"#.#.#.#.#.#",
"#.........#",
"#.........#",
"###########"
];

const goals = [
 [1,7], [3,7], [5,7], [7,7], [9,7]
];

let walls = [];
let boxes = [];
let player = {x:5,y:1};
let finished = false;

function resetGame() {
  walls = [];
  boxes = [];
  player = {x:5,y:1};
  finished = false;

  for(let y=0;y<level.length;y++) {
    for(let x=0;x<level[y].length;x++) {
      const tile = level[y][x];

      if(tile === "#") walls.push({x,y});
      if(tile === "B") boxes.push({x,y});
    }
  }

  document.getElementById("message").textContent = "";
  draw();
}

function hasWall(x,y) {
  return walls.some(w => w.x===x && w.y===y);
}

function boxAt(x,y) {
  return boxes.findIndex(b => b.x===x && b.y===y);
}

function isGoal(x,y) {
  return goals.some(g => g[0]===x && g[1]===y);
}

function move(dx,dy) {
  if(finished) return;

  const nx = player.x+dx;
  const ny = player.y+dy;

  if(hasWall(nx,ny)) return;

  const index = boxAt(nx,ny);

  if(index !== -1) {
    const bx = nx+dx;
    const by = ny+dy;

    if(hasWall(bx,by) || boxAt(bx,by)!==-1) {
      return;
    }

    boxes[index] = {x:bx,y:by};
  }

  player = {x:nx,y:ny};

  draw();
  checkWin();
}

function draw() {
  const game = document.getElementById("game");
  game.innerHTML = "";

  for(let y=0;y<level.length;y++) {
    for(let x=0;x<level[y].length;x++) {
      const cell = document.createElement("div");
      cell.className = "cell";

      if(hasWall(x,y)) {
        cell.classList.add("wall");
        cell.textContent = "🌲";
      } else if(boxAt(x,y)!==-1) {
        cell.textContent = "🎁";
        if(isGoal(x,y)) cell.textContent = "🎁";
      } else if(player.x===x && player.y===y) {
        cell.textContent = "🎅";
      } else if(isGoal(x,y)) {
        cell.textContent = "🧦";
      } else {
        cell.textContent = "❄️";
      }

      game.appendChild(cell);
    }
  }
}

function checkWin() {
  const count = boxes.filter(b =>
    isGoal(b.x,b.y)
  ).length;

  if(count===5) {
    finished = true;
    document.getElementById("message").textContent =
      "🎉 Bra jobbat Leo! Bokstaven är I.";
  }
}

document.addEventListener("keydown", function(e) {
  const keys = {
    ArrowUp:[0,-1],
    ArrowDown:[0,1],
    ArrowLeft:[-1,0],
    ArrowRight:[1,0]
  };

  if(keys[e.key]) {
    e.preventDefault();
    move(...keys[e.key]);
  }
});

resetGame();
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomtens stora juläventyr</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #e8f3e9;
  color: #234b34;
  padding: 12px;
}
h1 { color: #b51f32; }

#game {
  display: grid;
  grid-template-columns: repeat(15, min(6vw, 39px));
  gap: 2px;
  justify-content: center;
  margin: 20px auto;
}
.cell {
  width: min(6vw, 39px);
  height: min(6vw, 39px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f8f2;
  border-radius: 4px;
  font-size: min(5vw, 23px);
  box-sizing: border-box;
}
.wall { background: #286044; }

.controls {
  display: grid;
  grid-template-columns: repeat(3, 60px);
  gap: 6px;
  justify-content: center;
  margin: 18px;
}
button {
  background: #b51f32;
  color: white;
  border: none;
  border-radius: 9px;
  padding: 12px;
  font-size: 22px;
  cursor: pointer;
}
.reset {
  background: #315d43;
  font-size: 16px;
}
#message {
  font-size: 22px;
  font-weight: bold;
  color: #16834a;
  margin: 20px auto;
}
</style>
</head>
<body>

<h1>🎅 Tomtens stora juläventyr 🎄</h1>
<p>Hjälp tomten att flytta alla fem julklappar 🎁</p>
<p>Placera dem på de fem julstrumporna 🧦!</p>
<p>Akta dig för träden och planera dina drag noga.</p>

<div id="game"></div>

<div class="controls">
  <span></span>
  <button onclick="move(0,-1)">⬆️</button>
  <span></span>
  <button onclick="move(-1,0)">⬅️</button>
  <button onclick="move(0,1)">⬇️</button>
  <button onclick="move(1,0)">➡️</button>
</div>

<button class="reset" onclick="resetGame()">
  🔄 Börja om
</button>

<div id="message"></div>

<script>
const level = [
"###############",
"#.............#",
"#..#.....#....#",
"#.............#",
"#..#.....#....#",
"#.............#",
"#.....#.......#",
"#.....#.......#",
"#.............#",
"#..#.....#....#",
"#.............#",
"#.............#",
"###############"
];

const startBoxes = [
 {x:4,y:3},
 {x:10,y:3},
 {x:7,y:5},
 {x:4,y:9},
 {x:10,y:9}
];

const goals = [
 [2,1],
 [12,1],
 [2,11],
 [7,11],
 [12,11]
];

let walls = [];
let boxes = [];
let player = {x:7,y:1};
let finished = false;

function resetGame() {
  walls = [];
  boxes = startBoxes.map(b => ({...b}));
  player = {x:7,y:1};
  finished = false;

  for(let y=0;y<level.length;y++) {
    for(let x=0;x<level[y].length;x++) {
      if(level[y][x] === "#")
        walls.push({x,y});
    }
  }

  document.getElementById("message").textContent = "";
  draw();
}

function wallAt(x,y) {
  return walls.some(w => w.x===x && w.y===y);
}

function boxAt(x,y) {
  return boxes.findIndex(b => b.x===x && b.y===y);
}

function goalAt(x,y) {
  return goals.some(g => g[0]===x && g[1]===y);
}

function move(dx,dy) {
  if(finished) return;

  const nx = player.x+dx;
  const ny = player.y+dy;

  if(wallAt(nx,ny)) return;

  const index = boxAt(nx,ny);

  if(index !== -1) {
    const bx = nx+dx;
    const by = ny+dy;

    if(wallAt(bx,by) || boxAt(bx,by)!==-1)
      return;

    boxes[index] = {x:bx,y:by};
  }

  player = {x:nx,y:ny};
  draw();
  checkWin();
}

function draw() {
  const game = document.getElementById("game");
  game.innerHTML = "";

  for(let y=0;y<level.length;y++) {
    for(let x=0;x<level[y].length;x++) {
      const cell = document.createElement("div");
      cell.className = "cell";

      if(wallAt(x,y)) {
        cell.classList.add("wall");
        cell.textContent = "🌲";
      } else if(boxAt(x,y)!==-1) {
        cell.textContent = "🎁";
      } else if(player.x===x && player.y===y) {
        cell.textContent = "🎅";
      } else if(goalAt(x,y)) {
        cell.textContent = "🧦";
      } else {
        cell.textContent = "❄️";
      }

      game.appendChild(cell);
    }
  }
}

function checkWin() {
  const completed = boxes.filter(b =>
    goalAt(b.x,b.y)
  ).length;

  if(completed === 5 && boxes.length === 5) {
    finished = true;
    document.getElementById("message").textContent =
      "🎉 Snyggt jobbat Leo! Dagens bokstav är T.";
  }
}

document.addEventListener("keydown", function(e) {
  const keys = {
    ArrowUp:[0,-1],
    ArrowDown:[0,1],
    ArrowLeft:[-1,0],
    ArrowRight:[1,0]
  };

  if(keys[e.key]) {
    e.preventDefault();
    move(...keys[e.key]);
  }
});

resetGame();
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tectonic till Leo</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #edf2fa;
  padding: 20px;
}
h1 { color: #263b65; }
#board {
  display: grid;
  grid-template-columns: repeat(5, 60px);
  justify-content: center;
  gap: 3px;
  margin: 25px auto;
}
.cell {
  width: 56px;
  height: 56px;
  box-sizing: border-box;
  font-size: 24px;
  font-weight: bold;
  text-align: center;
  border: 2px solid #536783;
  border-radius: 5px;
  color: #263b65;
}
.cell:disabled {
  opacity: 1;
  color: #263b65;
}
.A { background: #dceaff; }
.B { background: #fce6d5; }
.C { background: #e2f2df; }
.D { background: #f4e3fa; }
.E { background: #fff1c9; }

button {
  padding: 12px 24px;
  background: #263b65;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
}
#message {
  font-size: 22px;
  font-weight: bold;
  color: #16834a;
  margin-top: 20px;
}
</style>
</head>
<body>

<h1>🧩 Tectonic till Leo</h1>
<p>Fyll i de tomma rutorna med siffrorna 1–5.</p>
<p>Varje färgat område ska innehålla 1, 2, 3, 4 och 5.</p>
<p>Samma siffror får inte ligga intill varandra,
inte heller diagonalt.</p>

<div id="board"></div>

<button onclick="check()">Kontrollera svaret</button>
<div id="message"></div>

<script>

// Lösningen
const solution = [
 [1,3,5,2,4],
 [2,4,1,3,5],
 [3,5,2,4,1],
 [4,1,3,5,2],
 [5,2,4,1,3]
];

// Oregelbundna områden
const regions = [
 "ABBBB",
 "ACBEE",
 "ACCEE",
 "ACCDE",
 "ADDDD"
];

// Startledtrådar
const clues = [
 [1,0,0,2,0],
 [0,4,0,0,5],
 [3,0,0,4,0],
 [0,1,0,0,2],
 [5,0,0,1,0]
];

const board = document.getElementById("board");

for(let r=0;r<5;r++){
  for(let c=0;c<5;c++){
    const input = document.createElement("input");

    input.className = "cell " + regions[r][c];
    input.type = "text";
    input.inputMode = "numeric";
    input.maxLength = 1;
    input.dataset.row = r;
    input.dataset.col = c;

    if(clues[r][c]){
      input.value = clues[r][c];
      input.disabled = true;
    } else {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/[^1-5]/g,"");
        document.getElementById("message").textContent = "";
      });
    }

    board.appendChild(input);
  }
}

function check(){

  const cells = [...document.querySelectorAll(".cell")];
  const values = Array.from({length:5},()=>[]);

  cells.forEach(cell=>{
    values[+cell.dataset.row][+cell.dataset.col] =
      Number(cell.value);
  });

  let valid = true;

  // Alla rutor måste vara ifyllda
  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){
      if(values[r][c]<1 || values[r][c]>5){
        valid = false;
      }
    }
  }

  // Kontrollera varje färgat område
  const groups = {};

  regions.forEach((row,r)=>{
    [...row].forEach((group,c)=>{
      if(!groups[group]) groups[group]=[];
      groups[group].push(values[r][c]);
    });
  });

  for(const group in groups){
    const nums = groups[group].slice().sort();
    if(nums.some((v,i)=>v!==i+1)){
      valid = false;
    }
  }

  // Kontrollera alla åtta grannrutorna
  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){

      for(let dr=-1;dr<=1;dr++){
        for(let dc=-1;dc<=1;dc++){

          if(dr===0 && dc===0) continue;

          const nr=r+dr;
          const nc=c+dc;

          if(nr>=0 && nr<5 && nc>=0 && nc<5){
            if(values[r][c]===values[nr][nc]){
              valid = false;
            }
          }
        }
      }
    }
  }

  const message = document.getElementById("message");

  if(valid){
    message.textContent =
      "🎉 Bra jobbat Leo! Dagens bokstav är T";
  } else {
    message.textContent =
      "Inte riktigt än! Försök igen Leo! 😊";
  }
}
</script>

</body>
</html>
